name: Validate desktop, database, and mobile
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: checklist_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECKLIST_TEST_PG_DSN: postgresql://postgres:disposable-ci-only@localhost:5432/checklist_test
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 postgresql-client
      - run: python -m pip install -r requirements-dev.txt
      - run: psql "$CHECKLIST_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f supabase/tests/local_bootstrap.sql
      - run: psql "$CHECKLIST_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/202610170001_sync.sql
      - run: python -m unittest discover -s tests -v
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-mobile-lockfile
          path: mobile/pubspec.lock
